name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      WHISPER_CPP_REVISION: 080bbbe85230f624f0b52127f1ae1218247989f9
      P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
      NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing/notarization secrets are configured
        run: |
          missing=()
          [ -z "$P12_BASE64" ] && missing+=("DEVELOPER_ID_APPLICATION_P12_BASE64")
          [ -z "$P12_PASSWORD" ] && missing+=("DEVELOPER_ID_APPLICATION_P12_PASSWORD")
          [ -z "$NOTARY_KEY_BASE64" ] && missing+=("APPLE_NOTARY_KEY_P8_BASE64")
          [ -z "$NOTARY_KEY_ID" ] && missing+=("APPLE_NOTARY_KEY_ID")
          [ -z "$NOTARY_ISSUER_ID" ] && missing+=("APPLE_NOTARY_ISSUER_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required Actions secrets: ${missing[*]}"
            echo "See docs/DISTRIBUTION.md ('GitHub Actions secrets') for how to generate and add them in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/localvoice-signing.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Prepare notarization key
        run: |
          test -n "$NOTARY_KEY_BASE64"
          test -n "$NOTARY_KEY_ID"
          test -n "$NOTARY_ISSUER_ID"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build whisper framework
        run: |
          mkdir -p "$HOME/LocalVoice-Dependencies"
          git init "$HOME/LocalVoice-Dependencies/whisper.cpp"
          git -C "$HOME/LocalVoice-Dependencies/whisper.cpp" remote add origin https://github.com/ggerganov/whisper.cpp.git
          git -C "$HOME/LocalVoice-Dependencies/whisper.cpp" fetch --depth 1 origin "$WHISPER_CPP_REVISION"
          git -C "$HOME/LocalVoice-Dependencies/whisper.cpp" checkout --detach FETCH_HEAD
          cd "$HOME/LocalVoice-Dependencies/whisper.cpp"
          ./build-xcframework.sh

      - name: Build LocalVoice
        run: |
          xcodebuild \
            -project LocalVoice.xcodeproj \
            -scheme LocalVoice \
            -configuration Release \
            -derivedDataPath .release-build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate release build
        run: |
          APP_PATH=".release-build/Build/Products/Release/LocalVoice.app"
          APP_BINARY="$APP_PATH/Contents/MacOS/LocalVoice"
          WHISPER_BINARY="$APP_PATH/Contents/Frameworks/whisper.framework/Versions/A/whisper"
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          lipo "$APP_BINARY" -verify_arch arm64 x86_64
          lipo "$WHISPER_BINARY" -verify_arch arm64 x86_64

      - name: Sign, notarize, and staple DMG
        run: |
          chmod +x scripts/create-dmg.sh scripts/sign-notarize-dmg.sh
          DEVELOPER_ID_APPLICATION="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)" \
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" \
          scripts/sign-notarize-dmg.sh \
            .release-build/Build/Products/Release/LocalVoice.app \
            "LocalVoice-${GITHUB_REF_NAME}.dmg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "LocalVoice $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            "LocalVoice-${GITHUB_REF_NAME}.dmg" \
            "LocalVoice-${GITHUB_REF_NAME}.dmg.sha256" \
            --clobber
